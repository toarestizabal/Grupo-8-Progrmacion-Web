<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi perfil - PixelForge Games</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/estilos.css"></head>
<body><header><h1>Mi perfil</h1><p>Consulta y modifica tus datos</p></header><nav class="navbar navbar-expand-md navbar-dark"><div class="container"><a class="navbar-brand" href="../index.html">PixelForge</a><div class="navbar-nav ms-auto"><a href="../index.html">Inicio</a></div></div></nav>
<main class="container"><section class="formulario-contenedor mx-auto"><h2 class="mb-4">Datos de la cuenta</h2><form id="formPerfil"><div class="mensaje-formulario d-none"></div><div class="row g-3">
<div class="col-12 col-md-6"><label class="form-label" for="nombre">Nombre completo</label><input class="form-control" id="nombre" name="nombre" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="usuario">Nombre de usuario</label><input class="form-control" id="usuario" name="usuario" required></div>
<div class="col-12"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" type="email" id="correo" name="correo" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="fecha">Fecha de nacimiento</label><input class="form-control" type="text" id="fecha" name="fecha" inputmode="numeric" maxlength="10" placeholder="DD-MM-AAAA" required><div class="invalid-feedback">Ingresa una fecha válida en formato DD-MM-AAAA.</div></div>
<div class="col-12 col-md-6"><label class="form-label" for="direccion">Dirección</label><input class="form-control" id="direccion" name="direccion"></div>
<div class="col-12"><label class="form-label" for="clave">Nueva contraseña <span class="opcional">(opcional)</span></label><input class="form-control" type="password" id="clave" name="clave" maxlength="18"><p class="form-text">8 a 18 caracteres, mayúscula, minúscula, número y símbolo.</p></div>
<div class="col-12 text-end"><button class="btn btn-primary" type="submit">Guardar cambios</button></div></div></form></section></main>
<footer><p>© 2026 PixelForge Games</p></footer><script src="../js/tienda.js"></script><script src="../js/cuenta.js"></script></body></html>
