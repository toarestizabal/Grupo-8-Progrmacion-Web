<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña - PixelForge Games</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/estilos.css"></head>
<body><header><h1>Recuperar contraseña</h1><p>Actualiza el acceso a tu cuenta</p></header>
<nav class="navbar navbar-expand-md navbar-dark"><div class="container"><a class="navbar-brand" href="../index.html">PixelForge</a><div class="navbar-nav ms-auto"><a href="../index.html">Inicio</a></div></div></nav>
<main class="container"><section class="formulario-contenedor formulario-corto mx-auto"><h2 class="mb-4">Nueva contraseña</h2>
<form id="formRecuperar"><div class="mensaje-formulario d-none"></div>
<label class="form-label" for="correo">Correo registrado</label><input class="form-control mb-3" type="email" id="correo" name="correo" required>
<label class="form-label" for="clave">Nueva contraseña</label><input class="form-control" type="password" id="clave" name="clave" minlength="8" maxlength="18" required><p class="form-text mb-3">8 a 18 caracteres, mayúscula, minúscula, número y símbolo.</p>
<label class="form-label" for="repetirClave">Repetir contraseña</label><input class="form-control mb-4" type="password" id="repetirClave" name="repetirClave" required>
<button class="btn btn-primary w-100" type="submit">Cambiar contraseña</button></form></section></main>
<footer><p>© 2026 PixelForge Games</p></footer><script src="../js/tienda.js"></script><script src="../js/cuenta.js"></script></body></html>
