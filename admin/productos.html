<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos - Administración PixelForge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/estilos.css"></head><body>
<header><h1>Administración</h1><p>Mantenedor de productos</p></header><nav class="navbar navbar-dark"><div class="container menu-admin"><a href="productos.html">Productos</a><a href="inventario.html">Inventario</a><a href="usuarios.html">Usuarios y clientes</a><a href="pedidos.html">Pedidos</a><a href="../index.html">Tienda</a></div></nav>
<main class="container"><div class="row g-4"><section class="col-12 col-xl-4"><form id="formProducto" class="formulario-contenedor needs-validation" novalidate><h2 id="tituloProducto">Registrar producto</h2><input type="hidden" name="idProducto">
<label class="form-label mt-3">Nombre</label><input class="form-control" name="nombre" required><label class="form-label mt-3">Categoría</label><select class="form-select" name="categoria" required><option>Acción</option><option>Aventura</option><option>Deportes</option><option>RPG</option><option>Combate</option></select>
<div class="row"><div class="col-6"><label class="form-label mt-3">Precio US$</label><input class="form-control" name="precio" type="number" min="0.01" step="0.01" required></div><div class="col-6"><label class="form-label mt-3">Stock</label><input class="form-control" name="stock" type="number" min="0" required></div></div>
<label class="form-label mt-3">Ruta de imagen</label><input class="form-control" name="imagen" placeholder="imagenes/juego.jpg" required><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="activo" id="activo" checked><label class="form-check-label" for="activo">Visible en el catálogo</label></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn btn-outline-light" type="button" id="cancelarEdicion">Limpiar</button></div></form></section>
<section class="col-12 col-xl-8"><div class="panel"><h2>Productos registrados</h2><div class="table-responsive"><table class="table table-dark align-middle"><thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaProductos"></tbody></table></div></div></section></div></main><footer><p>© 2026 PixelForge Games</p></footer><script src="../js/tienda.js"></script><script src="../js/administracion.js"></script></body></html>
